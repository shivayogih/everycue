name: Android CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, APKs and release bundle
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Enforce release artifact size budgets
        shell: bash
        run: |
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          release_aab="app/build/outputs/bundle/release/app-release.aab"
          test "$(stat -c%s "$release_apk")" -le $((12 * 1024 * 1024))
          test "$(stat -c%s "$release_aab")" -le $((12 * 1024 * 1024))

      - name: Enforce release privacy manifest
        shell: bash
        run: |
          manifest="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          test -f "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$manifest"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: everycue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: everycue-release-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: everycue-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
